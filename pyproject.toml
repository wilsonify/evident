[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "evident"
version = "0.1.0"
description = "A reusable toolkit for evidence-driven applications"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = []

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.4",
]

[project.scripts]
evidence = "evident.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/evident"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v"

[tool.ruff]
src = ["src"]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
