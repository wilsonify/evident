name: Publish to PyPI

permissions:
  contents: read

on:
  push:
    tags:
      - 'v*.*.*'

concurrency:
  group: pypi-publish
  cancel-in-progress: false

jobs:
  build:
    if: github.repository == 'wilsonify/evident'
    name: Build and verify
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Check out source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.2.2
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.4.0
        with:
          python-version: '3.11'
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e '.[dev]'

      - name: Run ruff
        run: python -m ruff check src tests

      - name: Run pytest
        run: python -m pytest -q

      - name: Verify tag matches version
        run: python scripts/check_tag_matches_version.py --tag "${GITHUB_REF_NAME}"

      - name: Build release artifacts
        run: python scripts/build_release.py

      - name: Upload distributions as artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: dist
          path: dist/*
          if-no-files-found: error
          retention-days: 7

  publish:
    if: github.repository == 'wilsonify/evident'
    name: Publish to PyPI
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/evidentkit/
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Download distributions
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: dist
          path: dist/

      - name: Publish package to PyPI
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # release/v1
        with:
          packages-dir: dist/
          print-hash: true
          attestations: true
